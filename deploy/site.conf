server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # short cache for the page and scripts, long for the big static files
    location / { add_header Cache-Control "public, max-age=300"; try_files $uri $uri/ =404; }
    location ~* \.(png|mp3|woff2?|gz|bin|json)$ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
}
